# Publishes a downloadable Windows installer to a GitHub Release.
#
# To cut a release:
#
#   1. Set the number in internal/version/version.go
#   2. go run ./scripts/setversion     (propagates it to wails.json and README)
#   3. go test ./...                   (the version tests fail if anything drifted)
#   4. git tag v1.0.0-beta && git push origin v1.0.0-beta
#
# The tag must match internal/version.Version exactly, apart from the leading
# "v". The job checks this first and stops if they disagree: a release whose
# artifacts report a different number than the tag is worse than no release,
# because the .sql files it generates carry that version in their header.
#
# It can also be run by hand from the Actions tab to test the pipeline without
# publishing anything.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Not 1.27: wails v2.10.2's static analysis pass uses an
          # x/tools that cannot read its export data, and the build fails with
          # `internal error: package "strings" without types`.
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check the tag matches the compiled-in version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $src = Get-Content internal/version/version.go -Raw
          if ($src -notmatch 'const Version = "([^"]+)"') { throw "could not read Version from internal/version/version.go" }
          $compiled = $Matches[1]
          if ($tag -ne $compiled) {
            throw "tag $tag does not match internal/version.Version $compiled. Update the constant, run ``go run ./scripts/setversion``, and retag."
          }
          Write-Host "Releasing $compiled"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Fetch the offline WebView2 runtime
        shell: pwsh
        run: ./scripts/fetch-webview2.ps1

      - name: Build the installer
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\go\bin;${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          # No -BuildStamp: a release reports its release number and nothing
          # else. Stamping the commit made the application call itself
          # "1.0.0-beta+4e4e261", which reads like a defect to an operator, and
          # the release page already records which commit a tag was built from.
          ./scripts/package-installer.ps1

      - name: Name the artifacts after the release
        id: artifacts
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$(git rev-parse --short HEAD)" }

          $installer = Get-ChildItem build/bin -Filter '*installer*.exe' | Select-Object -First 1
          if (-not $installer) { throw "no installer was produced" }
          $named = "build/bin/PGSheet-$version-setup.exe"
          Move-Item $installer.FullName $named -Force

          # The bare executable as well: anyone who already has the WebView2
          # runtime does not need the much larger installer.
          Compress-Archive -Path build/bin/PGSheet.exe -DestinationPath "build/bin/PGSheet-$version-windows-amd64.zip" -Force

          "installer=$named"                                            >> $env:GITHUB_OUTPUT
          "portable=build/bin/PGSheet-$version-windows-amd64.zip"       >> $env:GITHUB_OUTPUT

      # Kept for workflow_dispatch runs, which publish nothing: this is how you
      # get the installer out of a test run.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.portable }}
          retention-days: 14

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.portable }}
          body: |
            ## Download

            **`PGSheet-${{ github.ref_name }}-setup.exe`** installs PGSheet and,
            if the machine does not already have it, the Microsoft WebView2
            runtime it needs. It requires no internet connection.

            `PGSheet-${{ github.ref_name }}-windows-amd64.zip` is the bare
            executable, for machines that already have WebView2.

            Windows 10 or 11, 64-bit. You also need a PostgreSQL database you
            can reach, with an account that can read the target table.
